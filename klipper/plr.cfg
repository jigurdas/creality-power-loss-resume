# Power loss recovery prompt (klippy/extras/plr_prompt.py)
# Seconds after Klipper is ready before asking, so Fluidd/GuppyScreen connect
[plr_prompt]
delay: 15

# Shows up in GuppyScreen/Fluidd macro lists as a manual fallback
[gcode_macro POWER_LOSS_RESUME]
description: Show the power loss recovery menu
gcode:
    PLR_CHECK
